name: Evidence workspace UI
on:
  pull_request:
    paths: ['apps/arena/public/**','apps/arena/src/workspace-ui.test.ts','scripts/verify-evidence-workspace.py','.github/workflows/evidence-workspace.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: python -m pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Exercise local simulator and disabled phone path
        run: |
          node packages/cli/dist/bin.js demo --no-open > /tmp/arena.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python scripts/verify-evidence-workspace.py
      - name: Save textual verification
        if: always()
        run: |
          if [ -f ui-review/report.json ]; then
            printf '## Local scripted Arena checks\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat ui-review/report.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with: {name: evidence-workspace-review, path: ui-review/, retention-days: 1}
