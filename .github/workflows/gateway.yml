name: Omnichannel Gateway
on:
  pull_request:
  push:
    branches: [main, feat/omnichannel-sales-agent]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Standalone gateway tests (no credentials, no external calls)
        run: node --test apps/gateway/test/*.node.mjs
      - name: Build existing runtime and verify integration imports
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          node apps/gateway/test/runtime-smoke.mjs
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned iOS Simulator application
        working-directory: apps/ios
        run: xcodebuild -project Oathra.xcodeproj -scheme Oathra -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
