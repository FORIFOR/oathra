name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:deps
      - name: X announcement draft stays within the platform limit
        run: node scripts/publish-x-intake.mjs --validate
      - name: Website must build without precompiled workspace packages
        run: pnpm build:site
      - run: pnpm build
      - run: pnpm test
      - name: Scenarios validate
        run: pnpm oathra scenario validate scenarios/**/*.yaml
      - name: Eval (False Completion must be 0)
        run: pnpm oathra eval --runs 3
      - name: Adversarial eval (10,000 simulator runs, no API keys)
        run: pnpm oathra eval --adversarial 10000
      - name: Pack smoke (npx oathra from a tarball)
        run: |
          node scripts/export-recorded-check.mjs > /tmp/oathra-recorded-check.json
          cd packages/cli && npm pack --pack-destination /tmp && cd /tmp
          mkdir npx-smoke && cd npx-smoke && npm init -y >/dev/null && npm i --silent /tmp/oathra-*.tgz
          npx oathra verify /tmp/oathra-recorded-check.json > /tmp/oathra-recorded-result.json
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { deepStrictEqual } from "node:assert"; import { verifyTranscript } from "oathra/evidence"; import { EvidenceEngine } from "oathra"; deepStrictEqual(verifyTranscript(JSON.parse(readFileSync("/tmp/oathra-recorded-check.json"))), JSON.parse(readFileSync("/tmp/oathra-recorded-result.json"))); new EvidenceEngine();'
          npx oathra play restaurant-reservation --fast --no-save --quiet

  scenario-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Community scenarios must be valid, solvable and free of false completions
        run: |
          pnpm oathra scenario validate scenarios/**/*.yaml
          pnpm oathra eval scenarios --runs 2
