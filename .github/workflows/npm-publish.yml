name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (must match packages/cli/package.json)"
        required: true
        default: "v0.1.18"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check tag and package versions
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN repository secret is required" >&2; exit 1; }
          expected="${RELEASE_TAG#v}"
          actual="$(node -p "require('./packages/cli/package.json').version")"
          test "$expected" = "$actual" || { echo "tag $RELEASE_TAG does not match package version $actual" >&2; exit 1; }
      - name: Publish oathra
        working-directory: packages/cli
        run: npm publish --access public --provenance
